name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: older glibc, so the Linux build runs on more distributions
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: uv sync --group build
      - name: Test backend
        if: runner.os == 'Linux'
        working-directory: backend
        run: uv run pytest -q
      - name: Package
        working-directory: backend
        run: uv run --group build python ../packaging/build.py ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: build-release/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: packaging/release-notes/${{ github.ref_name }}.md
          files: packages/*.zip
